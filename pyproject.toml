[project]
name = "sport-coaching-ai"
version = "0.1.0"
description = "Coach sportif IA personnel (Strava/Coros) — terrain de pratique du dev assisté par IA"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.3",
    "stravalib>=2.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
